name: Release v0.1.0 once

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    name: Build and publish v0.1.0
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate project version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"

          if [[ "$PROJECT_VERSION" != "0.1.0" ]]; then
            echo "::error::Expected mod_version=0.1.0, found $PROJECT_VERSION."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v0.1.0" >/dev/null 2>&1; then
            echo "::error::Tag v0.1.0 already exists."
            exit 1
          fi

      - name: Build release
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Find release JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t JARS < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              ! -name '*-dev.jar' \
              | sort
          )

          if [[ "${#JARS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one release JAR, found ${#JARS[@]}."
            printf '%s\n' "${JARS[@]}"
            exit 1
          fi

          echo "jar=${JARS[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v0.1.0" \
            "${{ steps.jar.outputs.jar }}#Fabric mod JAR" \
            --target "$GITHUB_SHA" \
            --title "Treasure Map Fix v0.1.0" \
            --generate-notes \
            --latest
